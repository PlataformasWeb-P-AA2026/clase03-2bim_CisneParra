<h3>Listado de Estudiantes</h3>
<hr>
<br/>

<ul>

{% for e in estudiantes %}

  <li>{{ e.id }} - {{ e.nombre }} - telefonos ({{ e.mis_numeros_telefonicos.count }})</li>

{% endfor %}

</ul>

<hr>
<table border="1" cellspacing="0">
  <tr>
    <th>ID</th>
    <th>Nombre</th>
    <th>Teléfonos</th>
  </tr>
  {% for e in estudiantes %}
  <tr>
    <td>{{ e.id }}</td>
    <td>{{ e.nombre }}</td>
    <td>{{ e.mis_numeros_telefonicos.count }}</td>
  </tr>
  {% endfor %}
</table>
